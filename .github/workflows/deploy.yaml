name: Deploy StudyPal AI

on:
  push:
    branches: main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Debug repo structure
        working-directory: .
        run: ls -la

      - name: Copy samconfig
        run: cp samconfig.toml.example samconfig.toml

      - run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "GroqApiKey=${{ secrets.GROQ_API_KEY }}"

      - name: Sync frontend to S3
        working-directory: .
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name student-support-ai-system \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendS3Bucket'].OutputValue" \
            --output text)
          aws s3 cp frontend/index.html s3://$BUCKET/
